name: Deploy

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 82.156.132.43 >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=no root@82.156.132.43 "echo connected"

      - name: Deploy
        run: |
          ssh root@82.156.132.43 "
            set -eux
            cd /opt/complass-frontend
            git pull origin dev
            docker build -t complass-frontend:latest .
            docker compose up -d
            sleep 3
            curl -f --max-time 10 http://127.0.0.1:80/
          "
